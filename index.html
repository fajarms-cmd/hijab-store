/* Layout: sticky header with cart, compact hero, filter chips, product grid, 3-step order guide, footer. Cart and the owner's "Kelola toko" panel are side drawers. */

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1614; --surface: #17211E; --fg: #ECF0EA; --muted: #98A8A2; --line: #2B3A36;
  --accent: #F0B72F; --accent-ink: #14211E; --deep: #17211E; --deep-fg: #ECF0EA; --tile-l: 26%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; }

button { font: inherit; color: inherit; cursor: pointer; }

.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }

.cartbtn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 24px; height: 24px; display: grid; place-items: center; font-size: .85rem; padding: 0 6px; }

.hero { padding-block: 44px 28px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: end; }

.hero p { color: var(--muted); max-width: 40ch; margin: 0 0 14px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 10px 20px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tile { --veil: hsl(var(--h) 36% calc(73% - 0.43 * var(--tile-l))); --veil2: hsl(var(--h) 36% calc(60% - 0.43 * var(--tile-l))); aspect-ratio: 1 / 1; overflow: hidden; display: grid; place-items: center; background: hsl(var(--h) 34% var(--tile-l)); }
.tile svg { width: 100%; height: 100%; display: block; }

.info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.info h3 { font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; }
.cat { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.row { display: flex; gap: 8px; margin-top: auto; align-items: stretch; }

.how h2 { font-size: 1.15rem; margin-bottom: 4px; }

footer { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: space-between; }
footer strong { color: var(--fg); }
.copy { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; margin-left: 6px; font-size: .85rem; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.drawer, .panel { position: fixed; top: 0; right: 0; bottom: 0; background: var(--surface); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.25);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 16px; gap: 14px; }
.drawer { width: min(420px, 100%); z-index: 50; }
.panel { width: min(620px, 100%); z-index: 60; }
.drawer header, .panel header { display: flex; justify-content: space-between; align-items: center; }
.drawer h2, .panel h2 { font-size: 1.4rem; }
.x { background: transparent; border: 1px solid var(--line); border-radius: 8px; width: 38px; height: 38px; font-size: 1.2rem; }
.items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.empty { color: var(--muted); padding: 24px 0; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.line .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.line .vr { color: var(--muted); font-size: .88rem; }
.line .sub { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.qty { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
.qty button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; }
.qty span { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.form { display: grid; gap: 8px; }
label { font-size: .82rem; color: var(--muted); display: grid; gap: 4px; min-width: 0; }
.total { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.wa { display: block; text-align: center; background: #1FA855; color: #fff; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 10px; }
.wa[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }

.admin-open { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 35; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.pbody { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.pbody h3 { font-size: 1.05rem; }

.pfoot .hint { flex: 1; min-width: 0; }
.save { background: var(--deep); color: var(--deep-fg); border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; flex: none; }

.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .info { padding: 10px 12px 12px; }

@media (prefers-reduced-motion: no-preference) {

  .add, .cartbtn, .x, .mini, .addp, .save { transition: transform .12s, background .2s; }

  .grid.anim .card { animation: rise .9s ease-out backwards; animation-delay: calc(var(--i, 0) * 110ms); }

  .bump { animation: bump .6s ease-in-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
}

/* ===== Backdrop animasi ===== */
body::after {
  content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40vmax 40vmax at 20% 25%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%),
    radial-gradient(45vmax 45vmax at 80% 30%, color-mix(in srgb, #6FB5A3 24%, transparent), transparent 70%),
    radial-gradient(50vmax 50vmax at 50% 85%, color-mix(in srgb, #E58FA8 20%, transparent), transparent 70%);
  filter: blur(30px);
}
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0); }
  50%  { transform: translate3d(4%, -3%, 0) scale(1.12) rotate(6deg); }
  100% { transform: translate3d(-4%, 4%, 0) scale(1.05) rotate(-6deg); }
}
@keyframes scrimIn {
  from { opacity: 0; backdrop-filter: blur(0); }
  to   { opacity: 1; backdrop-filter: blur(4px); }
}
@media (prefers-reduced-motion: no-preference) {
  body::after { animation: drift 22s ease-in-out infinite alternate; }
  .scrim { backdrop-filter: blur(4px); animation: scrimIn .5s ease-out; }
}

/* ===== Gelembung kecil ===== */
#bubbles { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#bubbles i {
  position: absolute; bottom: -40px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), color-mix(in srgb, var(--accent) 22%, transparent) 55%, transparent 72%);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  opacity: 0;
}
@keyframes bubbleUp {
  0%   { transform: translate3d(0, 0, 0) scale(.7); opacity: 0; }
  10%  { opacity: .85; }
  50%  { transform: translate3d(var(--dx), -55vh, 0) scale(1); }
  90%  { opacity: .6; }
  100% { transform: translate3d(calc(var(--dx) * -1), -115vh, 0) scale(1.15); opacity: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  #bubbles i { animation: bubbleUp var(--d) linear var(--t) infinite; }
}

  $("scrimA").addEventListener("click", closeAdmin);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("panel").hidden) closeAdmin(); else if (!$("drawer").hidden) setOpen(false);
  });

  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("user"), window.claude.use("artifact"), window.claude.use("assets")]).then(function (r) {
      artifactApi = r[1]; assetsApi = r[2];
      if (!r[0] || !artifactApi) return;
      return r[0].canEdit().then(function (ok) { if (ok) $("admOpen").hidden = false; });
    }).catch(function () {});
  }
})();
</script>

</body></html>
